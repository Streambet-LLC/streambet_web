name: Build and Deploy

on:
  push:
    branches: [non_pro_stag]

jobs:
  build:
    runs-on: ubuntu-latest
    container: node:22
    steps:
      - uses: actions/checkout@v4

      - name: Install AWS CLI
        uses: unfor19/install-aws-cli-action@v1

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Configure AWS & Build
        shell: bash
        run: |
          # 1. AWS Auth Logic
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION=us-east-1

          # 2. Fetch SSM Parameters
          REF="${{ github.ref_name }}"
          VITE_API_URL=$(aws ssm get-parameter --name "/cardcade/$REF/VITE_API_URL" --with-decryption --query "Parameter.Value" --output text)
          VITE_APP_HOST_URL=$(aws ssm get-parameter --name "/cardcade/$REF/VITE_APP_HOST_URL" --with-decryption --query "Parameter.Value" --output text)
          VITE_BUGSNAG_KEY=$(aws ssm get-parameter --name "/cardcade/$REF/VITE_BUGSNAG_KEY" --with-decryption --query "Parameter.Value" --output text)
          VITE_BUGSNAG_SERVER=$(aws ssm get-parameter --name "/cardcade/$REF/VITE_BUGSNAG_SERVER" --with-decryption --query "Parameter.Value" --output text)
          VITE_COINFLOW_API_URL=$(aws ssm get-parameter --name "/cardcade/$REF/VITE_COINFLOW_API_URL" --with-decryption --query "Parameter.Value" --output text)
          VITE_COINFLOW_BLOCKCHAIN=$(aws ssm get-parameter --name "/cardcade/$REF/VITE_COINFLOW_BLOCKCHAIN" --with-decryption --query "Parameter.Value" --output text)
          VITE_COINFLOW_CHARGEBACK_PROTECTION_MERCHANT_ID=$(aws ssm get-parameter --name "/cardcade/$REF/VITE_COINFLOW_CHARGEBACK_PROTECTION_MERCHANT_ID" --with-decryption --query "Parameter.Value" --output text)
          VITE_COINFLOW_ENV=$(aws ssm get-parameter --name "/cardcade/$REF/VITE_COINFLOW_ENV" --with-decryption --query "Parameter.Value" --output text)
          VITE_COINFLOW_MERCHANT_ID=$(aws ssm get-parameter --name "/cardcade/$REF/VITE_COINFLOW_MERCHANT_ID" --with-decryption --query "Parameter.Value" --output text)
          VITE_S3_BASE_URL=$(aws ssm get-parameter --name "/cardcade/$REF/VITE_S3_BASE_URL" --with-decryption --query "Parameter.Value" --output text)

          # 3. Build
          npm ci && npm run build
        env:
          # Pass secrets into the shell environment
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist/

      - name: AWS S3 & CloudFront Deploy
        run: |
          ENV_UPPER=$(echo "${{ github.ref_name }}" | tr '[:lower:]' '[:upper:]')

          # Dynamic secret selection using brackets
          # Note: Secrets must be named exactly S3_BUCKET_DEV, S3_BUCKET_PROD, etc.
          S3_BUCKET="${{ secrets[format('S3_BUCKET_{0}', env.ENV_UPPER)] }}"
          CF_ID="${{ secrets[format('CLOUDFRONT_ID_{0}', env.ENV_UPPER)] }}"

          aws s3 sync dist/ "s3://$S3_BUCKET" --delete
          aws cloudfront create-invalidation --distribution-id "$CF_ID" --paths "/*"
        env:
          AWS_ACCESS_KEY_ID: secrets.AWS_ACCESS_KEY
          AWS_SECRET_ACCESS_KEY: secrets.AWS_SECRET_ACCESS_KEY
          AWS_DEFAULT_REGION: us-east-1
