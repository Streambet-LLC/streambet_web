name: Build and Deploy

on:
  push:
    branches: [non_pro_stag, non_pro_prod]

jobs:
  build:
    runs-on: ubuntu-latest
    container: node:22
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install sudo
        run: apt-get update && apt-get install -y sudo

      - name: Install or Update AWS CLI v2 to the latest
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "/tmp/awscliv2.zip"
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update
          rm -rf /tmp/aws/ /tmp/awscliv2.zip

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Configure AWS & Build
        shell: bash
        run: |
          # 2. Fetch SSM Parameters
          REF="${{ github.ref_name }}"
          PARAMS=(
            VITE_API_URL
            VITE_APP_HOST_URL
            VITE_BUGSNAG_KEY
            VITE_BUGSNAG_SERVER
            VITE_COINFLOW_API_URL
            VITE_COINFLOW_BLOCKCHAIN
            VITE_COINFLOW_CHARGEBACK_PROTECTION_MERCHANT_ID
            VITE_COINFLOW_ENV
            VITE_COINFLOW_MERCHANT_ID
            VITE_S3_BASE_URL
            VITE_SOLANA_RPC_URL
            VITE_MIXPANEL_TOKEN
          )
          for name in "${PARAMS[@]}"; do
            full="/cardcade/$REF/$name"
            if ! value=$(aws ssm get-parameter --name "$full" --with-decryption --query "Parameter.Value" --output text 2>/tmp/ssm_err); then
              echo "::error::Missing SSM parameter: $full"
              cat /tmp/ssm_err
              exit 1
            fi
            export "$name=$value"
          done

          # 3. Build
          npm ci && npm run build
        env:
          # Pass secrets into the shell environment
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist/

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Client-side routes (/auctions/..., /login, /auth/verify-email) aren't S3
      # objects, so S3 answers 403/404. Serve index.html with 200 instead so
      # deep links work. Idempotent; keeps any other custom error responses.
      - name: Ensure SPA fallback on CloudFront
        continue-on-error: true
        run: |
          CF_ID="${{ secrets[format('CLOUDFRONT_ID_{0}', github.ref_name)] }}"
          if ! aws cloudfront get-distribution-config --id "$CF_ID" > /tmp/cf.json 2>/tmp/cf.err; then
            echo "::warning::Can't read the CloudFront config ($(head -c 160 /tmp/cf.err)). Set custom error responses 403/404 -> /index.html (200) on this distribution, or grant GHDeployer cloudfront:GetDistributionConfig + UpdateDistribution."
            exit 0
          fi
          ETAG=$(jq -r '.ETag' /tmp/cf.json)
          HAS=$(jq '[(.DistributionConfig.CustomErrorResponses.Items // [])[] | select((.ErrorCode == 403 or .ErrorCode == 404) and .ResponsePagePath == "/index.html" and .ResponseCode == "200")] | length' /tmp/cf.json)
          if [ "$HAS" -ge 2 ]; then echo "SPA fallback already configured"; exit 0; fi
          jq '.DistributionConfig
            | .CustomErrorResponses.Items = (
                [(.CustomErrorResponses.Items // [])[] | select(.ErrorCode != 403 and .ErrorCode != 404)]
                + [
                    {ErrorCode: 403, ResponsePagePath: "/index.html", ResponseCode: "200", ErrorCachingMinTTL: 10},
                    {ErrorCode: 404, ResponsePagePath: "/index.html", ResponseCode: "200", ErrorCachingMinTTL: 10}
                  ])
            | .CustomErrorResponses.Quantity = (.CustomErrorResponses.Items | length)' /tmp/cf.json > /tmp/cf-new.json
          aws cloudfront update-distribution --id "$CF_ID" --if-match "$ETAG" --distribution-config file:///tmp/cf-new.json > /dev/null
          echo "SPA fallback configured"

      - name: AWS S3 & CloudFront Deploy
        run: |
          S3_BUCKET="${{ secrets[format('S3_BUCKET_{0}', github.ref_name)] }}"
          CF_ID="${{ secrets[format('CLOUDFRONT_ID_{0}', github.ref_name)] }}"

          aws s3 sync dist/ "s3://$S3_BUCKET" --delete
          aws cloudfront create-invalidation --distribution-id "$CF_ID" --paths "/*"
