    <!-- Open Graph / Social Media sharing tags -->
    <meta property="og:title" content="collectIQ — trading cards market intelligence. AI powered. Collector Focused." />
    <meta property="og:description" content="AI-powered market intelligence for trading cards — real-time pricing, trend forecasts, and a research analyst that tells you where every market stands." />
    <!--
      og:image MUST be an absolute URL — the Open Graph spec requires it and
      scrapers (Telegram, Slack, iMessage) resolve relative paths
      inconsistently or not at all. The ?v= is a cache buster: previews are
      cached by URL, so replacing the file in place never refreshes them —
      bump this whenever the image content changes.
    -->
    <meta
      property="og:image"
      content="https://cardcade.fun/lovable-uploads/socialshare.png?v=2"
    />
    <meta property="og:image:width" content="523" />
    <meta property="og:image:height" content="275" />
    <meta
      property="og:image:alt"
      content="collectIQ — trading cards market intelligence. AI powered. Collector focused."
    />
    <meta property="og:url" content="https://cardcade.fun" />
    <meta property="og:type" content="website" />
